name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: niceties_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.3"
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
      - name: Install deps
        run: mix deps.get
      - name: Run tests
        run: mix test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export LANG=en_US.UTF-8
            export LC_ALL=en_US.UTF-8
            export PATH=/home/${{ secrets.VPS_USER }}/.asdf/installs/elixir/1.19.5-otp-28/bin:/home/${{ secrets.VPS_USER }}/.asdf/installs/erlang/28.3.1/bin:/usr/local/bin:/usr/bin:/bin
            set -a; source /etc/niceties/env; set +a
            cd /home/${{ secrets.VPS_USER }}/niceties
            git pull origin main
            mix deps.get --only prod
            MIX_ENV=prod mix compile
            MIX_ENV=prod mix assets.deploy
            MIX_ENV=prod mix ecto.migrate
            sudo systemctl restart niceties.service
